<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline Map</title>
<link rel="stylesheet" href="lib/maplibre-gl.css">
<style>
  :root { --ui:rgba(28,28,30,.92); --uiink:#f5f5f7; --uimute:#98989f; --uihair:rgba(255,255,255,.12); --uihov:rgba(255,255,255,.1); --mapbg:#1c1c1e; }
  :root[data-theme="light"] { --ui:rgba(255,255,255,.94); --uiink:#1c1c1e; --uimute:#6e6e73; --uihair:rgba(0,0,0,.1); --uihov:rgba(0,0,0,.06); --mapbg:#f2f2f7; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --ui:rgba(255,255,255,.94); --uiink:#1c1c1e; --uimute:#6e6e73; --uihair:rgba(0,0,0,.1); --uihov:rgba(0,0,0,.06); --mapbg:#f2f2f7; } }
  html, body, #map { margin:0; height:100%; background:var(--mapbg); font:14px -apple-system, sans-serif; }
  .theme-fab { right:10px !important; bottom:auto !important; top:112px; background:var(--ui) !important; color:var(--uiink); }
  .ui { position:absolute; z-index:2; background:var(--ui); color:var(--uiink); border-radius:12px; box-shadow:0 4px 18px rgba(0,0,0,.35); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); }
  .back { top:10px; left:10px; padding:8px 12px; text-decoration:none; color:#0a84ff; }
  #places { top:10px; left:50%; transform:translateX(-50%); display:flex; gap:4px; padding:4px; }
  #places button, #near button { font:inherit; color:inherit; background:transparent; border:0; padding:6px 10px; border-radius:8px; cursor:pointer; }
  #places button:hover, #near button:hover { background:var(--uihov); }
  #near { top:58px; left:10px; width:300px; max-height:calc(100% - 120px); display:none; flex-direction:column; overflow:hidden; }
  #near.open { display:flex; }
  #near h3 { margin:12px 14px 6px; font-size:16px; }
  #kinds { display:flex; flex-wrap:wrap; gap:6px; padding:0 12px 10px; border-bottom:1px solid var(--uihair); }
  #kinds label { display:flex; align-items:center; gap:5px; padding:4px 8px; border-radius:99px; background:var(--uihov); cursor:pointer; user-select:none; }
  #kinds i { width:10px; height:10px; border-radius:50%; }
  #list { overflow-y:auto; }
  #list div { padding:9px 14px; border-top:1px solid var(--uihair); cursor:pointer; display:flex; gap:10px; align-items:baseline; }
  #list div:hover { background:var(--uihov); }
  #list i { width:10px; height:10px; border-radius:50%; flex:none; transform:translateY(1px); }
  #list span { margin-left:auto; color:var(--uimute); white-space:nowrap; }
  #list p { color:var(--uimute); margin:12px 14px; }
  #toggle { top:10px; right:54px; padding:8px 12px; cursor:pointer; border:0; font:inherit; color:var(--uiink); }
  @media (max-width:700px) { #places { top:52px; left:10px; transform:none; } #near { top:100px; width:calc(100% - 20px); max-height:45%; } }
</style>
<script src="theme.js?v=2"></script>
</head>
<body>
<a class="ui back" href="index.html">← Command Center</a>
<div class="ui" id="places"></div>
<button class="ui" id="toggle">Near Home</button>
<div class="ui" id="near"><h3>Near the map center</h3><div id="kinds"></div><div id="list"></div></div>
<div id="map"></div>
<script src="lib/maplibre-gl.js"></script>
<script src="lib/basemaps.js"></script>
<script src="data/near.js?v=2"></script>
<script>
  const dark = isDark();
  addEventListener('themechange', () => location.reload());  // the basemap colors are baked into the style
  const flavor = dark ? 'dark' : 'light';
  const base = location.origin + location.pathname.replace(/[^/]*$/, '');
  // One map file per region in maps/ (served by pmtiles on :8091). Regions don't overlap, so each
  // gets its own copy of the basemap layers; only the first keeps the background layer.
  const REGIONS = ['us-west', 'san-antonio'];
  // Near Home: OpenStreetMap places from the same tiles ("pois" layer, by kind).
  const KINDS = [
    ['Hospitals', '#ff453a', ['hospital']],
    ['Urgent care', '#ff9f0a', ['clinic', 'doctors']],
    ['Fire stations', '#ff6b00', ['fire_station']],
    ['Police', '#0a84ff', ['police']],
    ['Pharmacies', '#30d158', ['pharmacy']],
    ['Drinking water', '#64d2ff', ['drinking_water']],
    ['Groceries', '#bf5af2', ['supermarket']],
    ['Fuel', '#ffd60a', ['fuel']],
  ];
  const sources = {}, layers = [];
  REGIONS.forEach((r, i) => {
    sources[r] = { type: 'vector', maxzoom: 15, tiles: ['http://127.0.0.1:8091/' + r + '/{z}/{x}/{y}.mvt'], attribution: '© OpenStreetMap contributors, Protomaps' };
    for (const l of basemaps.layers(r, basemaps.namedFlavor(flavor), { lang: 'en' })) {
      if (l.type === 'background' && i > 0) continue;
      layers.push({ ...l, id: r + ':' + l.id });
    }
  });
  const allKinds = KINDS.flatMap(k => k[2]);
  const color = ['match', ['get', 'kind'], ...KINDS.flatMap(([, c, ks]) => ks.flatMap(k => [k, c])), '#888'];
  // Near Home places: pre-built index (data/near.js, from scripts/near-index.sh), shown at any zoom.
  sources.near = { type: 'geojson', data: { type: 'FeatureCollection', features: (window.NEAR || []).map(([kind, name, lon, lat]) =>
    ({ type: 'Feature', properties: { kind, name }, geometry: { type: 'Point', coordinates: [lon, lat] } })) } };
  layers.push({ id: 'near-dot', type: 'circle', source: 'near', layout: { visibility: 'none' },
    paint: { 'circle-color': color, 'circle-radius': ['interpolate', ['linear'], ['zoom'], 9, 4, 15, 8], 'circle-stroke-color': '#fff', 'circle-stroke-width': 1.5 } });
  layers.push({ id: 'near-label', type: 'symbol', source: 'near', minzoom: 12,
    layout: { visibility: 'none', 'text-field': ['get', 'name'], 'text-font': ['Noto Sans Medium'], 'text-size': 12, 'text-offset': [0, 1.2], 'text-anchor': 'top', 'text-optional': true },
    paint: { 'text-color': dark ? '#fff' : '#1c1c1e', 'text-halo-color': dark ? '#000' : '#fff', 'text-halo-width': 1.5 } });

  const startHash = location.hash;   // read before the map writes its own
  const map = new maplibregl.Map({
    container: 'map', center: [-110, 36], zoom: 4, maxZoom: 18, hash: true,
    style: { version: 8, glyphs: base + 'assets/fonts/{fontstack}/{range}.pbf', sprite: base + 'assets/sprites/v4/' + flavor, sources, layers },
  });
  map.addControl(new maplibregl.NavigationControl());
  map.addControl(new maplibregl.ScaleControl({ unit: 'imperial' }));

  const PLACES = { 'Las Vegas': [-115.14, 36.17, 12], 'Henderson': [-114.98, 36.04, 13], 'San Antonio': [-98.49, 29.42, 12] };
  for (const [name, [lon, lat, z]] of Object.entries(PLACES)) {
    const b = document.createElement('button'); b.textContent = name;
    b.onclick = () => map.jumpTo({ center: [lon, lat], zoom: Math.max(z, near ? 13 : 0) });
    document.getElementById('places').appendChild(b);
  }

  // Near Home panel
  let near = false;
  const on = new Set(KINDS.map(k => k[0]).filter(n => !['Groceries', 'Fuel', 'Drinking water'].includes(n)));
  const kindsEl = document.getElementById('kinds'), listEl = document.getElementById('list');
  KINDS.forEach(([name, c]) => {
    const l = document.createElement('label');
    l.innerHTML = `<input type="checkbox" ${on.has(name) ? 'checked' : ''} hidden><i style="background:${c}"></i>${name}`;
    l.style.opacity = on.has(name) ? 1 : .45;
    l.onclick = e => { e.preventDefault(); on.has(name) ? on.delete(name) : on.add(name); l.style.opacity = on.has(name) ? 1 : .45; applyFilter(); };
    kindsEl.appendChild(l);
  });
  const activeKinds = () => KINDS.filter(k => on.has(k[0])).flatMap(k => k[2]);
  function applyFilter() {
    const f = ['in', ['get', 'kind'], ['literal', activeKinds()]];
    ['near-dot', 'near-label'].forEach(id => { map.setFilter(id, f); map.setLayoutProperty(id, 'visibility', near ? 'visible' : 'none'); });
    setTimeout(updateList, 50);
  }
  const miles = (a, b) => { const R = 3958.8, t = Math.PI / 180, dLat = (b.lat - a.lat) * t, dLon = (b.lng - a.lng) * t;
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * t) * Math.cos(b.lat * t) * Math.sin(dLon / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };
  function updateList() {
    if (!near) return;
    const c = map.getCenter(), kinds = new Set(activeKinds()), bounds = map.getBounds();
    const feats = (window.NEAR || []).filter(([k]) => kinds.has(k))
      .map(([kind, name, lng, lat]) => ({ kind, name: name || kind.replace(/_/g, ' '), lng, lat, d: miles(c, { lng, lat }), inView: bounds.contains([lng, lat]) }))
      .sort((a, b) => a.d - b.d).slice(0, 60);
    const col = k => (KINDS.find(x => x[2].includes(k)) || [, '#888'])[1];
    listEl.innerHTML = !(window.NEAR || []).length ? '<p>No places index. Run scripts/near-index.sh.</p>'
      : feats.length && feats[0].d < 60 ? feats.map((f, i) => `<div data-i="${i}"><i style="background:${col(f.kind)}"></i>${f.name.replace(/[<&]/g, '')}<span>${f.d < 0.1 ? '<0.1' : f.d.toFixed(1)} mi</span></div>`).join('')
      : '<p>Places are indexed around Las Vegas, Henderson and San Antonio. Pick one above.</p>';
    listEl.querySelectorAll('[data-i]').forEach(el => el.onclick = () => { const f = feats[el.dataset.i]; map.flyTo({ center: [f.lng, f.lat], zoom: Math.max(map.getZoom(), 15) }); });
  }
  function setNear(v) {
    near = v; document.getElementById('near').classList.toggle('open', v);
    document.getElementById('toggle').textContent = v ? 'Hide places' : 'Near Home';
    applyFilter();
  }
  document.getElementById('toggle').onclick = () => setNear(!near);
  map.on('moveend', updateList);
  map.on('load', () => {
    if (new URLSearchParams(location.search).get('near')) {
      if (!startHash) map.jumpTo({ center: [-115.06, 36.09], zoom: 11 });
      setNear(true);
    }
  });
</script>
</body>
</html>
